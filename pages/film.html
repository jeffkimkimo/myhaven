  <link rel="stylesheet" href="../film_slider/style.css" />
  <style>
    nav a {
      color: #d2d2d2;
      letter-spacing: 0.08em;
    }

    nav a#logo {
      font-family: "PP Neue Montreal", sans-serif;
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      text-transform: uppercase;
      font-weight: 700;
      color: #f6c344;
    }

    nav .watch-link {
      font-size: 0.75rem;
      color: #f6c344;
      border: 1px solid rgba(246, 195, 68, 0.45);
      border-radius: 999px;
      padding: 0.65rem 1rem;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    nav .watch-link:hover {
      background: rgba(246, 195, 68, 0.12);
      color: #fff;
    }

    nav .watch-link.is-disabled,
    nav .watch-link.is-disabled:hover {
      color: rgba(255, 255, 255, 0.58);
      border-color: rgba(255, 255, 255, 0.3);
      background: rgba(255, 255, 255, 0.04);
      transform: none;
      box-shadow: none;
      cursor: not-allowed;
      pointer-events: none;
    }

    .slider-items {
      max-height: 62vh;
      overflow-y: auto;
      scrollbar-width: thin;
      padding-right: 0.25rem;
    }

    .slider-items p {
      max-width: 280px;
      text-wrap: balance;
    }

    footer p {
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.08em;
    }

    @media (max-width: 900px) {
      nav {
        padding: 1.2em;
      }

      nav .watch-link {
        padding: 0.5rem 0.85rem;
      }

      .slider-items {
        left: 1.2em;
        bottom: 1.5em;
      }

      .slider-counter {
        bottom: 1.25em;
      }

      footer {
        right: 1.2em;
        bottom: 1.2em;
      }
    }
  </style>
</head>
