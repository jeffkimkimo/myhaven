<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Inspirations | Jeffkim Aminiel Kimo</title>
  <link rel="icon" type="image/png" href="../assets/branding/jklogo2.png" />
  <style>
    @import url("https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap");

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "DM Mono", monospace;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .back-link {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 20;
      color: #f6c344;
      text-decoration: none;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      border: 1px solid rgba(246, 195, 68, 0.5);
      border-radius: 999px;
      background: rgba(10, 11, 16, 0.74);
      padding: 8px 12px;
      transition: background 0.2s ease, border-color 0.2s ease;
    }

    .back-link:hover {
      background: rgba(246, 195, 68, 0.16);
      border-color: rgba(246, 195, 68, 0.9);
    }

    .page-label {
      position: fixed;
      top: 22px;
      right: 18px;
      z-index: 20;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
    }

    .slider {
      position: fixed;
      width: 100vw;
      height: 100svh;
      overflow: hidden;
      touch-action: none;
    }

    .slide {
      position: absolute;
      width: 45vw;
      height: 100vh;
      overflow: hidden;
      will-change: transform;
      contain: paint;
      transform: translateZ(0);
    }

    .slide img {
      will-change: transform;
      transform: translateZ(0);
      backface-visibility: hidden;
    }

    .slide-title {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #fff;
      text-align: center;
      text-transform: uppercase;
      font-size: 0.8rem;
      font-weight: 500;
      line-height: 1;
      background-color: #000;
      padding: 0.22rem 0.4rem;
      pointer-events: none;
      z-index: 3;
    }

    .thumbnail-wheel {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 1;
    }

    .thumbnail-item {
      position: absolute;
      width: 35px;
      height: 50px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.1);
      will-change: transform;
      transform: translateZ(0);
    }

    @media (max-width: 1000px) {
      .slide {
        width: 75vw;
      }

      .thumbnail-item {
        width: 20px;
        height: 30px;
      }

      .page-label {
        display: none;
      }
    }
  </style>
</head>
<body>
  <a class="back-link" href="../portfolio.html?skipIntro=1">&#8592; Back to portfolio</a>
  <p class="page-label">Inspirations</p>

  <div class="slider">
    <p class="slide-title">Inspirations</p>
  </div>
  <div class="thumbnail-wheel"></div>

  <script>
    (() => {
      const slider = document.querySelector('.slider');
      const slideTitle = document.querySelector('.slide-title');
      const thumbnailWheel = document.querySelector('.thumbnail-wheel');

      if (!slider || !slideTitle || !thumbnailWheel) {
        return;
      }

      const inspirations = [
        { name: 'Andrew Garfield', file: 'Andrew garfield.jpg' },
        { name: 'Bruno Mars', file: 'Bruno mars.jpg' },
        { name: 'James Cameron', file: 'Cameron.jpg' },
        { name: 'Chris Evans', file: 'Chris evans.jpg' },
        { name: 'Chris Hemsworth', file: 'Chris hemsworth.webp' },
        { name: 'Cole Palmer', file: 'Cole Palmer.webp', position: 'center 20%' },
        { name: 'Cristiano Ronaldo', file: 'Cristiano Ronaldo.jpg' },
        { name: 'Daniel Craig', file: 'Daniel Craig.jpg' },
        { name: 'Dean Ambrose', file: 'Dean ambrose.webp' },
        { name: 'Suillaud Dylan', file: 'DylanSuillaud.jpg', position: 'center 30%' },
        { name: 'Eden Hazard', file: 'Eden Hazard.webp' },
        { name: 'Eminem', file: 'Eminem.webp' },
        { name: 'Grant Gustin', file: 'Grant Gustin.jpg' },
        { name: 'Haaland', file: 'Haaland.webp' },
        { name: 'Hans Zimmer', file: 'Hans Zimmer.jpg' },
        { name: 'Jack Harlow', file: 'Jack Harlow.jpg' },
        { name: 'Jeff Hardy', file: 'Jeff Hardy.jpg' },
        { name: 'John Cena', file: 'John Cena.avif' },
        { name: 'Julius Nyerere', file: 'Julius Nyerere.jpeg' },
        { name: 'Kendrick Lamar', file: 'Kendrick Lamar.jpg', position: 'center 20%' },
        { name: 'Khantrast', file: 'Khantrast.jpg' },
        { name: 'LeBron James', file: 'Lebron James.jpg' },
        { name: 'Leo Messi', file: 'Leo Messi.jpg' },
        { name: 'Lewis Hamilton', file: 'Lewis hamilton.jpg' },
        { name: 'Mark Zuckerberg', file: 'Mark Zuckerberg.webp' },
        { name: 'Max Verstappen', file: 'Max Verstappen.jpg' },
        { name: 'Kylian Mbappe', file: 'Mbappe.jpg' },
        { name: 'Mckenna Grace', file: 'Mckenna 2.jpg', position: 'center 15%' },
        { name: 'NF', file: 'NF.jpeg' },
        { name: 'Nelson Mandela', file: 'Nelson Mandela.avif' },
        { name: 'Novak Djokovic', file: 'Novak Djokovic.jpg' },
        { name: 'Randy Orton', file: 'Randy Orton.jpg' },
        { name: 'Robert Downey Jr.', file: 'Robert Downey jr.webp' },
        { name: 'Roman Reigns', file: 'Roman reigns.jpg' },
        { name: 'Russo Bros', file: 'Russo Bros.webp' },
        { name: 'Sundar Pichai', file: 'SUndar pichai.webp' },
        { name: 'Scarlett Johansson', file: 'Scaret JOhanson.webp' },
        { name: 'Serena Williams', file: 'Serena Williams.avif' },
        { name: 'Seth Rollins', file: 'Seth rollins.jpg' },
        { name: 'Steven Spielberg', file: 'Spielberg.jpg' },
        { name: 'Stephen Curry', file: 'Stephen Curry.webp' },
        { name: 'Steve Jobs', file: 'Steve JObs.jpg' },
        { name: 'Tobey Maguire', file: 'TObey maguire.jpg' },
        { name: 'Quentin Tarantino', file: 'Tarantino.jpg' },
        { name: 'The Rock', file: 'The Rock.jpg' },
        { name: 'Tiger Woods', file: 'Tiger woods.jpg' },
        { name: 'Timothee Chalamet', file: 'Timothee Chalamet.jpg' },
        { name: 'Tom Cruise', file: 'Tom Cruise.jpg' },
        { name: 'Tom Holland', file: 'Tom Holland.webp', position: 'center 18%' },
        { name: 'Tundu Lissu', file: 'Tundu Lissu.jpg', position: 'center 18%' },
        { name: 'Undertaker', file: 'Undertaker.avif' },
        { name: 'Will Smith', file: 'Will smith.webp' },
        { name: 'Zendaya', file: 'Zendaya.webp' },
        { name: 'Christopher Nolan', file: 'nolan.webp' },
        { name: 'Recider', file: 'recider.jpg' }
      ];

      const totalSlides = inspirations.length;
      let isMobile = window.innerWidth < 1000;
      let slideWidth = isMobile ? window.innerWidth * 0.75 : window.innerWidth * 0.45;
      let viewportCenter = window.innerWidth / 2;
      let currentX = viewportCenter - slideWidth / 2;
      let targetX = currentX;
      let isPointerDown = false;
      let pointerX = 0;
      let pointerY = 0;
      let thumbnailTick = 0;
      let lastTitleIndex = -1;

      const slides = [];
      const slideImages = [];
      const thumbnails = [];

      const wrapValue = (value, max) => ((value % max) + max) % max;

      const applyImageMeta = (img, item) => {
        img.src = encodeURI(`../inspirations-web/${item.file.replace(/\.[^.]+$/, '.webp')}`);
        img.alt = item.name;
        if (item.position) {
          img.style.objectPosition = item.position;
        }
      };

      const createSlides = () => {
        const fragment = document.createDocumentFragment();
        inspirations.forEach((item, index) => {
          const slide = document.createElement('div');
          slide.className = 'slide';

          const img = document.createElement('img');
          applyImageMeta(img, item);
          img.loading = index < 6 ? 'eager' : 'lazy';
          img.decoding = 'async';
          if (index === 0) {
            img.fetchPriority = 'high';
          }

          slide.appendChild(img);
          fragment.appendChild(slide);
          slides.push(slide);
          slideImages.push(img);
        });
        slider.appendChild(fragment);
      };

      const createThumbnailItems = () => {
        thumbnailWheel.innerHTML = '';
        thumbnails.length = 0;
        const fragment = document.createDocumentFragment();

        inspirations.forEach((item, index) => {
          const thumbnail = document.createElement('div');
          thumbnail.className = 'thumbnail-item';
          thumbnail.dataset.baseAngle = String((index / totalSlides) * Math.PI * 2);

          const img = document.createElement('img');
          applyImageMeta(img, item);
          img.loading = 'lazy';
          img.decoding = 'async';

          thumbnail.appendChild(img);
          fragment.appendChild(thumbnail);
          thumbnails.push(thumbnail);
        });

        thumbnailWheel.appendChild(fragment);
      };

      const setLayoutMetrics = () => {
        isMobile = window.innerWidth < 1000;
        slideWidth = isMobile ? window.innerWidth * 0.75 : window.innerWidth * 0.45;
        viewportCenter = window.innerWidth / 2;
        const centerOffset = viewportCenter - slideWidth / 2;
        currentX = centerOffset;
        targetX = centerOffset;

        slides.forEach((slide) => {
          slide.style.width = `${slideWidth}px`;
        });
      };

      const updateThumbnails = () => {
        const exactSlideProgress = Math.abs(currentX) / slideWidth;
        const currentRotationAngle = -(exactSlideProgress * (360 / totalSlides)) + 90;
        const radius = isMobile ? 150 : 350;
        const centerX = window.innerWidth / 2;
        const centerY = window.innerHeight / 2 - 25;

        for (let i = 0; i < thumbnails.length; i += 1) {
          const thumbnail = thumbnails[i];
          const baseAngle = Number(thumbnail.dataset.baseAngle);
          const angle = baseAngle + (currentRotationAngle * Math.PI) / 180;
          const x = radius * Math.cos(angle) + centerX;
          const y = radius * Math.sin(angle) + centerY;
          thumbnail.style.transform = `translate3d(${x}px, ${y}px, 0)`;
        }
      };

      const animate = () => {
        currentX += (targetX - currentX) * 0.1;
        const totalWidth = totalSlides * slideWidth;

        if (currentX > totalWidth) {
          currentX -= totalWidth;
          targetX -= totalWidth;
        } else if (currentX < -totalWidth) {
          currentX += totalWidth;
          targetX += totalWidth;
        }

        const maxScale = isMobile ? 1.7 : 2.1;
        const outerDistance = slideWidth * 2.4;
        let centerSlideIndex = 0;
        let closestDistance = Number.POSITIVE_INFINITY;

        for (let i = 0; i < totalSlides; i += 1) {
          const rawX = i * slideWidth + currentX;
          let wrappedX = wrapValue(rawX, totalWidth);
          if (wrappedX > totalWidth - slideWidth) {
            wrappedX -= totalWidth;
          }

          const slide = slides[i];
          slide.style.transform = `translate3d(${wrappedX}px, 0, 0)`;

          const slideCenterX = wrappedX + slideWidth / 2;
          const distanceFromCenter = Math.abs(slideCenterX - viewportCenter);
          if (distanceFromCenter < closestDistance) {
            closestDistance = distanceFromCenter;
            centerSlideIndex = i;
          }

          const progress = Math.min(distanceFromCenter / outerDistance, 1);
          const easedProgress =
            progress < 0.5
              ? 2 * progress * progress
              : 1 - Math.pow(-2 * progress + 2, 2) / 2;
          const scale = 1 + easedProgress * (maxScale - 1);
          slideImages[i].style.transform = `translateZ(0) scale(${scale.toFixed(3)})`;
        }

        if (centerSlideIndex !== lastTitleIndex) {
          lastTitleIndex = centerSlideIndex;
          slideTitle.textContent = inspirations[centerSlideIndex]?.name || 'Inspirations';
        }

        thumbnailTick = (thumbnailTick + 1) % 2;
        if (thumbnailTick === 0) {
          updateThumbnails();
        }

        requestAnimationFrame(animate);
      };

      const handleWheel = (event) => {
        event.preventDefault();
        const delta = Math.max(-120, Math.min(120, event.deltaY || 0));
        targetX -= delta * 0.85;
      };

      const getPointerClientX = (event) => {
        if ('touches' in event && event.touches.length > 0) {
          return event.touches[0].clientX;
        }
        if ('changedTouches' in event && event.changedTouches.length > 0) {
          return event.changedTouches[0].clientX;
        }
        return event.clientX;
      };

      const startPointer = (event) => {
        isPointerDown = true;
        pointerX = getPointerClientX(event);
        if ('touches' in event && event.touches.length > 0) {
          pointerY = event.touches[0].clientY;
        } else if ('changedTouches' in event && event.changedTouches.length > 0) {
          pointerY = event.changedTouches[0].clientY;
        } else {
          pointerY = event.clientY;
        }
      };

      const movePointer = (event) => {
        if (!isPointerDown) return;
        const nextX = getPointerClientX(event);
        const deltaX = nextX - pointerX;
        let nextY = 0;
        if ('touches' in event && event.touches.length > 0) {
          nextY = event.touches[0].clientY;
        } else if ('changedTouches' in event && event.changedTouches.length > 0) {
          nextY = event.changedTouches[0].clientY;
        } else {
          nextY = event.clientY;
        }
        const deltaY = nextY - pointerY;
        pointerX = nextX;
        pointerY = nextY;

        if (Math.abs(deltaY) > Math.abs(deltaX)) {
          targetX -= deltaY * 1.15;
          return;
        }
        targetX += deltaX * 1.25;
      };

      const endPointer = () => {
        isPointerDown = false;
      };

      const onResize = () => {
        setLayoutMetrics();
        updateThumbnails();
      };

      createSlides();
      createThumbnailItems();
      setLayoutMetrics();
      updateThumbnails();

      window.addEventListener('wheel', handleWheel, { passive: false });
      window.addEventListener('resize', onResize);
      slider.addEventListener('pointerdown', startPointer);
      window.addEventListener('pointermove', movePointer);
      window.addEventListener('pointerup', endPointer);
      window.addEventListener('pointercancel', endPointer);

      animate();
    })();
  </script>
</body>
</html>
