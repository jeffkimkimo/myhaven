<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeffkim's Haven</title>
  <link rel="icon" type="image/png" href="assets/branding/jklogo2.png">
  <link rel="stylesheet" href="navigation_menu/style.css" />
  <style>
    body.intro-ended .index {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.45s ease;
    }

    .index {
      position: relative;
      z-index: 3;
    }

    .text-about-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      z-index: 2;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.7s ease, transform 1.05s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.intro-ended .text-about-frame {
      opacity: 1;
      transform: scale(1);
    }

    .shader-bg-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      pointer-events: none;
      opacity: 0;
      transform: scale(1.03);
      filter: saturate(1.35) contrast(1.22) brightness(0.9);
      transition: opacity 0.75s ease, transform 1s ease;
      z-index: 1;
    }

    .shader-bg-frame.is-active {
      opacity: 0.96;
      transform: scale(1);
    }

    body.intro-ended {
      background: #03050b;
    }

    body.intro-ended::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(120% 72% at 50% 102%, rgba(121, 194, 255, 0.24), transparent 46%),
        radial-gradient(90% 52% at 50% 100%, rgba(255, 255, 255, 0.1), transparent 56%);
      mix-blend-mode: screen;
      opacity: 0.72;
    }

    .menu-overlay .menu-bg {
      background-image: none;
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.16), transparent 46%),
        radial-gradient(circle at 78% 80%, rgba(134, 196, 255, 0.15), transparent 42%),
        linear-gradient(135deg, rgba(3, 7, 14, 0.36), rgba(0, 0, 0, 0.5));
      mix-blend-mode: screen;
      opacity: 0.82;
      backdrop-filter: blur(1.5px);
    }

    .menu-overlay {
      background: rgba(1, 4, 10, 0.16);
      backdrop-filter: blur(3px);
      z-index: 100;
    }

  </style>
</head>
<body class="intro-ended">

    loading="eager"
    aria-hidden="true"
  ></iframe>

  <div class="index">

        <div class="menu-overlay-items">

              <path d="M17.25 6.92a4.5 4.5 0 0 1-1.23-2.77h-2.5v10.07a2.38 2.38 0 1 1-2.38-2.38c.17 0 .33.02.49.05v-2.5a4.88 4.88 0 1 0 4.88 4.88V9.62a6.9 6.9 0 0 0 4 1.29V8.4a4.5 4.5 0 0 1-3.26-1.48Z"/>
            </svg>
          </a>
          <a href="https://x.com/jeffkimkimo" target="_blank" rel="noopener" aria-label="X">

              <path d="M17.46 3H20l-6.2 7.1L21 21h-5.2l-4.07-6.1L6.3 21H4l6.63-7.58L3 3h5.33l3.68 5.57L17.46 3Zm-.87 16.25h1.44L7.56 4.62H6.02l10.57 14.63Z"/>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="navigation_menu/script.js"></script>
  <script>
    (() => {
      // The intro sequence was removed; the portfolio is the landing state.
      // All that remains is bringing the menu shader up once it has loaded.
      const shaderFrame = document.getElementById('menu-shader');
      if (shaderFrame) {
        shaderFrame.addEventListener('load', () => {
          shaderFrame.classList.add('is-active');
        }, { once: true });
        shaderFrame.setAttribute('src', 'webshadergl/embed.html');
      }

      // Older links still carry ?skipIntro=1. It no longer does anything, so
      // tidy it out of the address bar rather than leaving it on screen.
      const url = new URL(window.location.href);
      if (url.searchParams.has('skipIntro')) {
        url.searchParams.delete('skipIntro');
        const q = url.searchParams.toString();
        window.history.replaceState({}, '', url.pathname + (q ? `?${q}` : '') + url.hash);
      }
    })();
  </script>
