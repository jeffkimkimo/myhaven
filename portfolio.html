<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jeffkim's Haven</title>
  <link rel="icon" type="image/png" href="assets/branding/jklogo2.png">
  <link rel="stylesheet" href="navigation_menu/style.css" />
  <style>
    body.intro-active {
      overflow: hidden;
    }

    body.intro-active .index {
      opacity: 0;
      pointer-events: none;
    }

    body.intro-ended .index {
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.45s ease;
    }

    .index {
      position: relative;
      z-index: 3;
    }

    .text-about-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: transparent;
      z-index: 2;
      opacity: 0;
      transform: scale(0.98);
      transition: opacity 0.7s ease, transform 1.05s cubic-bezier(0.22, 1, 0.36, 1);
    }

    body.intro-ended .text-about-frame {
      opacity: 1;
      transform: scale(1);
    }

    body.intro-active .text-about-frame {
      opacity: 0;
      pointer-events: none;
    }

    .shader-bg-frame {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      background: #000;
      pointer-events: none;
      opacity: 0;
      transform: scale(1.03);
      filter: saturate(1.35) contrast(1.22) brightness(0.9);
      transition: opacity 0.75s ease, transform 1s ease;
      z-index: 1;
    }

    .shader-bg-frame.is-active {
      opacity: 0.96;
      transform: scale(1);
    }

    body.intro-ended {
      background: #03050b;
    }

    body.intro-ended::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background:
        radial-gradient(120% 72% at 50% 102%, rgba(121, 194, 255, 0.24), transparent 46%),
        radial-gradient(90% 52% at 50% 100%, rgba(255, 255, 255, 0.1), transparent 56%);
      mix-blend-mode: screen;
      opacity: 0.72;
    }

    .menu-overlay .menu-bg {
      background-image: none;
      background:
        radial-gradient(circle at 22% 18%, rgba(255, 255, 255, 0.16), transparent 46%),
        radial-gradient(circle at 78% 80%, rgba(134, 196, 255, 0.15), transparent 42%),
        linear-gradient(135deg, rgba(3, 7, 14, 0.36), rgba(0, 0, 0, 0.5));
      mix-blend-mode: screen;
      opacity: 0.82;
      backdrop-filter: blur(1.5px);
    }

    .menu-overlay {
      background: rgba(1, 4, 10, 0.16);
      backdrop-filter: blur(3px);
      z-index: 100;
    }

    .intro-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050507;
      z-index: 200;
      transition: opacity 0.45s ease;
    }

    .intro-overlay.is-hidden {
      opacity: 0;
      pointer-events: none;
    }

    .intro-hero-overlay {
      z-index: 220;
    }

    .intro-hero-frame,
    .intro-frame {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0f0f0f;
      pointer-events: auto;
    }

    .intro-overlay-inner {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0f0f0f;
      touch-action: pan-y;
      overscroll-behavior: contain;
    }

    .intro-note {
      position: absolute;
      left: 16px;
      bottom: 16px;
      margin: 0;
      padding: 9px 12px;
      border-radius: 999px;
      border: 1px solid rgba(255, 215, 128, 0.3);
      background: rgba(13, 14, 20, 0.75);
      color: #e7ddc3;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      font-size: 0.82rem;
      z-index: 2;
    }

    .intro-enter {
      position: absolute;
      right: 16px;
      bottom: 16px;
      padding: 10px 16px;
      border-radius: 999px;
      border: 1px solid rgba(255, 215, 128, 0.5);
      background: rgba(13, 14, 20, 0.85);
      color: #f6c344;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      z-index: 2;
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.22s ease, visibility 0.22s ease, transform 0.22s ease, background 0.18s ease, border-color 0.18s ease;
    }

    .intro-enter.is-visible {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
      transform: translateY(0);
    }

    .intro-enter:hover {
      transform: translateY(-2px);
      background: rgba(246, 195, 68, 0.12);
      border-color: rgba(246, 195, 68, 0.85);
    }

    @media (max-width: 720px) {
      .intro-note {
        max-width: calc(100% - 24px);
        font-size: 0.7rem;
      }

      .intro-enter {
        right: 12px;
        bottom: 12px;
        padding: 8px 12px;
        font-size: 0.72rem;
      }
    }
  </style>
</head>
<body class="intro-active">
  <iframe

  <iframe

    title="Portfolio name animation"
    src="text_about/index.html?embed=1&text=JEFFKIM%20KIMO"

    aria-hidden="true"

  <div id="intro-hero-overlay" class="intro-overlay intro-hero-overlay" aria-hidden="false">
    <iframe
      id="intro-hero-frame"
      class="intro-hero-frame"
      src="intro_hero/index.html"
      title="Portfolio hero loader"

    ></iframe>
  </div>

  <div id="intro-overlay" class="intro-overlay is-hidden" aria-hidden="true">
    <div class="intro-overlay-inner" role="dialog" aria-modal="true" aria-label="Portfolio intro animation">

    </div>
  </div>

    <div class="menu-overlay" aria-hidden="true">

      <div class="menu-overlay-nav">
        <div class="close-btn" aria-label="Close menu" role="button" tabindex="0">
          <div class="close-btn-bar"></div>

        </div>

        <div class="menu-overlay-items">

            </svg>

              <path d="M17.46 3H20l-6.2 7.1L21 21h-5.2l-4.07-6.1L6.3 21H4l6.63-7.58L3 3h5.33l3.68 5.57L17.46 3Zm-.87 16.25h1.44L7.56 4.62H6.02l10.57 14.63Z"/>

      <div class="circular-menu">
        <div class="joystick">
          <ion-icon name="grid-sharp" class="center-icon center-main"></ion-icon>
          <ion-icon name="chevron-up-sharp" class="center-icon center-up"></ion-icon>
          <ion-icon name="chevron-down-sharp" class="center-icon center-down"></ion-icon>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.1/dist/gsap.min.js"></script>
  <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
  <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
  <script src="navigation_menu/script.js"></script>
  <script>
    (() => {
      const introHeroOverlay = document.getElementById('intro-hero-overlay');
      const introHeroFrame = document.getElementById('intro-hero-frame');
      const introOverlay = document.getElementById('intro-overlay');
      const introFrame = document.getElementById('intro-frame');
      const introEnter = document.getElementById('intro-enter');
      const shaderFrame = document.getElementById('menu-shader');
      let shaderLoaded = false;
      let shaderActivationRequested = false;
      let introCompleted = false;
      let introScrollWatcher = null;
      let introEnterFallbackTimer = null;
      let introTouchY = null;
      const INTRO_ENTER_FAILSAFE_MS = 18000;

      if (!introHeroOverlay || !introOverlay || !introFrame || !introHeroFrame) {
        document.body.classList.remove('intro-active');
        return;
      }

      const url = new URL(window.location.href);
      const skipByParam = url.searchParams.has('skipIntro');
      let heroFallbackTimer = null;
      const isInternalReferrer = (() => {
        if (!document.referrer) return false;
        try {
          const refUrl = new URL(document.referrer);
          if (refUrl.origin === window.location.origin) {
            return refUrl.pathname !== window.location.pathname;
          }
        } catch (error) {
          return false;
        }
        return false;
      })();

      const clearHeroFallback = () => {
        if (!heroFallbackTimer) return;
        window.clearTimeout(heroFallbackTimer);
        heroFallbackTimer = null;
      };

      const clearIntroScrollWatcher = () => {
        if (!introScrollWatcher) return;
        window.clearInterval(introScrollWatcher);
        introScrollWatcher = null;
      };

      const clearIntroEnterFallback = () => {
        if (!introEnterFallbackTimer) return;
        window.clearTimeout(introEnterFallbackTimer);
        introEnterFallbackTimer = null;
      };

      const hideOverlay = (overlay) => {
        overlay.classList.add('is-hidden');
        overlay.setAttribute('aria-hidden', 'true');
      };

      const showOverlay = (overlay) => {
        overlay.classList.remove('is-hidden');
        overlay.setAttribute('aria-hidden', 'false');
      };

      const reloadFrame = (frame) => {
        const src = frame.getAttribute('src');
        if (src) {
          frame.setAttribute('src', src);
        }
      };

      const hideIntroEnter = () => {
        if (!introEnter) return;
        introEnter.classList.remove('is-visible');
        introEnter.disabled = true;
      };

      const showIntroEnter = () => {
        if (!introEnter) return;
        introEnter.classList.add('is-visible');
        introEnter.disabled = false;
        clearIntroEnterFallback();
      };

      const getIntroFrameWindow = () => {
        if (!introFrame || !introFrame.contentWindow) return null;
        return introFrame.contentWindow;
      };

      const getIntroScrollMetrics = () => {
        const introWindow = getIntroFrameWindow();
        if (!introWindow) return null;

        try {
          const introDoc = introWindow.document.documentElement;
          const introBody = introWindow.document.body;
          const scrollTop =
            introWindow.scrollY ||
            introDoc.scrollTop ||
            (introBody ? introBody.scrollTop : 0) ||
            0;
          const viewportHeight = introWindow.innerHeight || introDoc.clientHeight || 0;
          const scrollHeight = Math.max(
            introDoc.scrollHeight,
            introBody ? introBody.scrollHeight : 0,
            introDoc.offsetHeight,
            introBody ? introBody.offsetHeight : 0,
            introDoc.clientHeight
          );

          return { scrollTop, viewportHeight, scrollHeight };
        } catch (error) {
          return null;
        }
      };

      const hasReachedIntroScrollEnd = () => {
        const metrics = getIntroScrollMetrics();
        if (!metrics) return false;
        if (metrics.scrollHeight <= metrics.viewportHeight + 2) return true;
        return metrics.scrollTop + metrics.viewportHeight >= metrics.scrollHeight - 24;
      };

      const syncIntroEnterFromScroll = () => {
        if (introCompleted || introOverlay.classList.contains('is-hidden')) {
          return;
        }
        if (hasReachedIntroScrollEnd()) {
          showIntroEnter();
        }
      };

      const startIntroScrollWatcher = () => {
        clearIntroScrollWatcher();
        introScrollWatcher = window.setInterval(syncIntroEnterFromScroll, 180);
        syncIntroEnterFromScroll();
      };

      const startIntroEnterFallback = () => {
        clearIntroEnterFallback();
        introEnterFallbackTimer = window.setTimeout(() => {
          if (!introCompleted && !introOverlay.classList.contains('is-hidden')) {
            showIntroEnter();
          }
        }, INTRO_ENTER_FAILSAFE_MS);
      };

      const forwardIntroScroll = (deltaY) => {
        if (!deltaY || Number.isNaN(deltaY)) return;

        const introWindow = getIntroFrameWindow();
        if (!introWindow) return;

        try {
          introWindow.scrollBy(0, deltaY);
        } catch (error) {
          return;
        }

        syncIntroEnterFromScroll();
      };

      const handleIntroWheel = (event) => {
        if (introCompleted || introOverlay.classList.contains('is-hidden')) return;
        if (Math.abs(event.deltaY) < 0.5) return;
        forwardIntroScroll(event.deltaY);
        event.preventDefault();
      };

      const handleIntroTouchStart = (event) => {
        if (introCompleted || introOverlay.classList.contains('is-hidden')) return;
        if (!event.touches || event.touches.length !== 1) return;
        introTouchY = event.touches[0].clientY;
      };

      const handleIntroTouchMove = (event) => {
        if (introCompleted || introOverlay.classList.contains('is-hidden')) return;
        if (introTouchY === null || !event.touches || event.touches.length !== 1) return;

        const currentY = event.touches[0].clientY;
        const deltaY = introTouchY - currentY;

        if (Math.abs(deltaY) < 0.8) return;

        forwardIntroScroll(deltaY);
        introTouchY = currentY;
        event.preventDefault();
      };

      const handleIntroTouchEnd = () => {
        introTouchY = null;
      };

      const primeMenuShader = () => {
        if (!shaderFrame) return;
        if (!shaderFrame.getAttribute('src')) {
          shaderFrame.setAttribute('src', 'webshadergl/embed.html');
        }
      };

      const showMenuShaderIfReady = () => {
        if (!shaderFrame || !shaderLoaded || !shaderActivationRequested) return;
        shaderFrame.classList.add('is-active');
      };

      const activateMenuShader = () => {
        if (!shaderFrame) return;
        shaderActivationRequested = true;
        primeMenuShader();
        showMenuShaderIfReady();
      };

      const finishIntro = () => {
        if (introCompleted) {
          return;
        }
        introCompleted = true;
        clearHeroFallback();
        clearIntroScrollWatcher();
        clearIntroEnterFallback();
        introTouchY = null;
        hideOverlay(introHeroOverlay);
        hideOverlay(introOverlay);
        hideIntroEnter();
        document.body.classList.remove('intro-active');
        document.body.classList.add('intro-ended');
        activateMenuShader();
      };

      const startAnimationIntro = () => {
        if (introCompleted) {
          return;
        }
        clearHeroFallback();
        hideOverlay(introHeroOverlay);
        showOverlay(introOverlay);
        document.body.classList.add('intro-active');
        document.body.classList.remove('intro-ended');
        hideIntroEnter();
        primeMenuShader();
        reloadFrame(introFrame);
        startIntroScrollWatcher();
        startIntroEnterFallback();
      };

      const startHeroLoader = () => {
        if (introCompleted) {
          return;
        }
        showOverlay(introHeroOverlay);
        hideOverlay(introOverlay);
        document.body.classList.add('intro-active');
        document.body.classList.remove('intro-ended');
        hideIntroEnter();
        clearIntroScrollWatcher();
        clearIntroEnterFallback();
        introTouchY = null;
        primeMenuShader();
        reloadFrame(introHeroFrame);
        clearHeroFallback();
        heroFallbackTimer = window.setTimeout(() => {
          startAnimationIntro();
        }, 12000);
      };

      const isMessageFromFrame = (event, frame, messageType) => {
        if (event.source !== frame.contentWindow) {
          return false;
        }
        if (!event.data || event.data.type !== messageType) {
          return false;
        }
        if (event.origin && event.origin !== 'null' && event.origin !== window.location.origin) {
          return false;
        }
        return true;
      };

      window.addEventListener('message', (event) => {
        if (introCompleted) {
          return;
        }
        if (isMessageFromFrame(event, introHeroFrame, 'intro-hero-complete')) {
          startAnimationIntro();
          return;
        }
        if (isMessageFromFrame(event, introFrame, 'intro-scroll-end')) {
          showIntroEnter();
        }
      });

      if (introEnter) {
        introEnter.addEventListener('click', finishIntro);
      }

      introOverlay.addEventListener('wheel', handleIntroWheel, { passive: false });
      introOverlay.addEventListener('touchstart', handleIntroTouchStart, { passive: true });
      introOverlay.addEventListener('touchmove', handleIntroTouchMove, { passive: false });
      introOverlay.addEventListener('touchend', handleIntroTouchEnd, { passive: true });
      introOverlay.addEventListener('touchcancel', handleIntroTouchEnd, { passive: true });
      introFrame.addEventListener('load', () => {
        syncIntroEnterFromScroll();
      });

      if (shaderFrame) {
        shaderFrame.addEventListener('load', () => {
          shaderLoaded = true;
          showMenuShaderIfReady();
        });
      }

      window.addEventListener('load', () => {
        if (skipByParam || isInternalReferrer) {
          finishIntro();
          if (skipByParam) {
            url.searchParams.delete('skipIntro');
            const cleanUrl =
              url.pathname +
              (url.searchParams.toString() ? `?${url.searchParams.toString()}` : '') +
              url.hash;
            window.history.replaceState({}, '', cleanUrl);
          }
          return;
        }
        startHeroLoader();
      });
    })();
  </script>
</body>
